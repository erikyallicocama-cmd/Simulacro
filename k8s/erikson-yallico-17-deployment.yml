apiVersion: apps/v1
kind: Deployment
metadata:
  name: erikson-yallico-17-deployment
  namespace: erikson-yallico-17-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: products-app
  template:
    metadata:
      labels:
        app: products-app
    spec:
      containers:
      - name: products-container
        image: erikson1999/17-erikson-yallico:1.0
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"